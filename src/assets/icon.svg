<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <!--
    GistPad's icon: a notebook with a blue spine and three tabs. It has no background of its own
    (each platform backs it: see index.html), and it stays within the central 80% of the canvas,
    so it's also maskable.
  -->
  <defs>
    <linearGradient id="page" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#ffffff" />
      <stop offset="1" stop-color="#e2e8f0" />
    </linearGradient>
    <linearGradient id="spine" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#5ad1fa" />
      <stop offset="1" stop-color="#0ea5e9" />
    </linearGradient>
    <linearGradient id="coral" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#fb8b8b" />
      <stop offset="1" stop-color="#ef5c5c" />
    </linearGradient>
    <linearGradient id="amber" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#fcd34d" />
      <stop offset="1" stop-color="#f5b60b" />
    </linearGradient>
    <linearGradient id="teal" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#5eead4" />
      <stop offset="1" stop-color="#14b8a6" />
    </linearGradient>
    <clipPath id="cover">
      <rect x="88" y="64" width="312" height="384" rx="44" />
    </clipPath>
    <!-- The notebook sits a little above its backing -->
    <filter id="shadow" x="-10%" y="-10%" width="120%" height="130%">
      <feDropShadow dx="0" dy="12" stdDeviation="14" flood-color="#0f172a" flood-opacity="0.22" />
    </filter>
  </defs>

  <g id="notebook" stroke="#1e293b" stroke-width="20" stroke-linejoin="round" filter="url(#shadow)">
    <!-- The tabs, which stick out from the cover's edge -->
    <g id="tabs">
      <rect x="384" y="112" width="60" height="64" rx="16" fill="url(#coral)" />
      <rect x="384" y="212" width="60" height="64" rx="16" fill="url(#amber)" />
      <rect x="384" y="312" width="60" height="64" rx="16" fill="url(#teal)" />
    </g>

    <!-- The cover: the page in view, and the spine -->
    <rect id="cover-page" x="88" y="64" width="312" height="384" rx="44" fill="url(#page)" />
    <g clip-path="url(#cover)" stroke="none">
      <rect id="spine" x="88" y="64" width="76" height="384" fill="url(#spine)" />
    </g>
    <line id="spine-edge" x1="164" y1="64" x2="164" y2="448" />
    <rect id="cover-outline" x="88" y="64" width="312" height="384" rx="44" fill="none" />

    <!-- The writing on the page -->
    <g id="lines" stroke="#94a3b8" stroke-width="20" stroke-linecap="round">
      <line x1="206" y1="158" x2="350" y2="158" />
      <line x1="206" y1="208" x2="350" y2="208" />
      <line x1="206" y1="258" x2="350" y2="258" />
      <line x1="206" y1="308" x2="350" y2="308" />
      <line x1="206" y1="358" x2="304" y2="358" />
    </g>
  </g>
</svg>
