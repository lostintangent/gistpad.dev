name: CI

on:
  pull_request:
    branches: [main]

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      # `bun lint` and `bun fmt` currently ship in canary builds only
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: canary

      - run: bun install --frozen-lockfile
      - run: bun check
      - run: bun lint
      - run: bun fmt --check
      - run: bun run build
